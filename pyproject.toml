[project]
name = "scaling-llama-3-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # flock (cerulean-works/flock) for flock.eval's Paloma scoring and the flock CLI. Its
    # root package ships the flock.* modules but declares no dependencies; those live in
    # its workspace members' pyprojects (flock/eval, flock/cli, ...), which are virtual
    # (package = false) and so cannot be installed as dependencies. The flock.eval and
    # flock.cli runtime deps this project does not already have are listed here instead,
    # the same set the flock uv tool install uses
    "flock",
    "accelerate>=1.15.0",
    "click>=8.5.0",
    "datasets>=5.1.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "sentencepiece>=0.2.3",
    "tokenizers>=0.23.3",
    "kernels>=0.17.2,<0.18.0 ; sys_platform == 'linux'",
    "pyarrow>=26.0.1",
    "pylance>=14.0.2",
    "torch>=2.15.0",
    "transformers>=5.22.1",
    "wandb>=0.31.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# CPU wheels on macOS only. Linux falls through to PyPI, whose torch wheels ship CUDA
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }]
flock = { git = "https://github.com/cerulean-works/flock", branch = "main" }

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.97",
]

[tool.ty.rules]
# torch declares `nn.Module.forward: Callable[..., Any]`, so ty flags every `def forward`
# override as writing to a mutable attribute. Not a real error for nn.Module subclasses
invalid-mutable-override = "ignore"

[tool.ruff.lint]
extend-select = ["ANN", "N"]
